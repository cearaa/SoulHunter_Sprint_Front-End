<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/main.js" defer></script>
</head>

<body>

    <header class="header">
        <div class="container nav-container">
            <h1 class="logo"> SoulHunter </h1>
            <button class="menu-toggle" id="menuToggle"> ☰ </button>
            <nav class="nav" id="navMenu">
                <a href="index.html"> Home </a>
                <a href="integrantes.html"> Integrantes </a>
                <a href="sobre.html"> Sobre </a>
                <a href="faq.html"> FAQ </a>

                <a href="dashboard.html"> Dashboard </a>
                <a href="ranking.html"> Ranking </a>
            </nav>
        </div>
    </header>


    <section class="section container">
        <h2> Ranking </h2>

        <select id="rankingFilter">
            <option value="all" aria-label="Todos"> Todos </option>
            <option value="ouro" aria-label="Ouro"> Ouro </option>
            <option value="prata" aria-label="Prata"> Prata </option>
            <option value="bronze" aria-label="Bronze"> Bronze </option>
        </select>

        <table class="table">
            <tr>
                <th> # </th>
                <th> Usuário </th>
                <th> Pontos </th>
                <th> Medalha </th>
            </tr>

            <tr class="ranking-row" data-level="ouro">
                <td>1º</td>
                <td> Ana </td>
                <td> 5000 </td>
                <td class="medal">🥇</td>
            </tr>

            <tr class="ranking-row" data-level="prata">
                <td>2º</td>
                <td> Lucas </td>
                <td> 3500 </td>
                <td class="medal">🥈</td>
            </tr>
            <tr class="ranking-row" data-level="bronze">
                <td>3º</td>
                <td>Pedro</td>
                <td>2800</td>
                <td class="medal">🥉</td>
            </tr>

            <tr class="ranking-row">
                <td>4º</td>
                <td>Maria</td>
                <td>2100</td>
                <td class="medal">—</td>
            </tr>

            <tr class="ranking-row">
                <td>5º</td>
                <td>João</td>
                <td>1500</td>
                <td class="medal">—</td>
            </tr>
        </table>
    </section>


    <footer class="footer">
        <p>&copy; 2026 SoulHunter - Plataforma Sustentável Gamificada.</p>
    </footer>

    <button class="back-top" id="backToTop"> ↑ </button>

    

</body>

</html>
